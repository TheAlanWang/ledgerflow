# LedgerFlow — local stack: Kafka (KRaft), Postgres, Airflow (runs PySpark batch in local mode),
# and a Spark Structured Streaming container for real-time alerts.
#
#   docker compose up -d postgres kafka airflow        # batch + scheduling
#   docker compose --profile stream up -d spark-stream # streaming alerts
#   docker compose --profile replay run --rm producer  # replay PaySim into Kafka (Python)
#   docker compose --profile replay-go run --rm producer-go  # same replay, Go producer

x-airflow-env: &airflow-env
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://ledger:ledger@postgres:5432/airflow
  LEDGER_DB_URL: jdbc:postgresql://postgres:5432/ledger
  LEDGER_DB_USER: ledger
  LEDGER_DB_PASSWORD: ledger
  LEDGER_DATA_DIR: /opt/ledgerflow/data

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
      POSTGRES_DB: ledger
    ports: ["55432:5432"]   # host 55432 (5432/5433 were already taken on this Mac)
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger"]
      interval: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.8.0
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 3

  kafka-init:
    image: apache/kafka:3.8.0
    depends_on: [kafka]
    restart: "no"
    # One-shot: create the topic up front so the streaming job never subscribes to a missing topic.
    command: ["bash", "-c", "for i in $$(seq 1 30); do /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic transactions --partitions 3 --replication-factor 1 && exit 0; sleep 2; done; exit 1"]

  airflow:
    build: ./docker/airflow
    depends_on:
      postgres: { condition: service_healthy }
    environment: *airflow-env
    command: standalone   # webserver + scheduler; admin password printed in logs
    ports: ["8080:8080"]
    volumes:
      - ./dags:/opt/airflow/dags
      - ./jobs:/opt/ledgerflow/jobs
      - ./data:/opt/ledgerflow/data

  spark-stream:
    profiles: ["stream"]
    image: apache/spark:3.5.3-python3
    depends_on:
      kafka-init: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
    user: root
    environment:
      LEDGER_DB_URL: jdbc:postgresql://postgres:5432/ledger
      LEDGER_DB_USER: ledger
      LEDGER_DB_PASSWORD: ledger
      KAFKA_BOOTSTRAP: kafka:29092
    volumes:
      - ./jobs:/opt/ledgerflow/jobs
      - ./data:/opt/ledgerflow/data
    command: >
      /opt/spark/bin/spark-submit
      --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.3,org.postgresql:postgresql:42.7.4
      /opt/ledgerflow/jobs/stream_alerts.py

  producer:
    profiles: ["replay"]
    image: python:3.11-slim
    depends_on:
      kafka-init: { condition: service_completed_successfully }
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
    volumes:
      - ./producer:/app
      - ./data:/data
    working_dir: /app
    command: sh -c "pip install -q kafka-python-ng==2.2.3 && python replay.py --csv /data/raw/paysim.csv"

  producer-go:
    profiles: ["replay-go"]
    build: ./producer-go
    depends_on:
      kafka-init: { condition: service_completed_successfully }
    volumes:
      - ./data:/data:ro
    command: ["-csv", "/data/raw/paysim.csv", "-brokers", "kafka:29092"]

volumes:
  pgdata:
